name: Build TRSS-PatchGUI

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

env:
  SEVENZIP_VER: "v26.02-v1.5.7-R2"
  SEVENZIP_NAME: "7z26.02-zstd-x64.exe"
  SEVENZIP_SFX_VER: "v25.01-v1.5.7-R3"
  HDIFFPATCH_VER: "v5.1.3"
  HSYNZ_VER: "v1.3.0"

  SEVENZIP_WIN_SHA256: "22dc4608d911d7c831437b969db66a42d0477cd3f5d93987cae9f59774857fc1"
  SEVENZIP_LINUX_SHA256: "be246e5a284d3b5e738bad5cbb24c2662996ddb9776e09575b5099ab53fa0ba3"
  SEVENZIP_SFX_SHA256: "b3a748d6863d5f34a927d1a2bc562afc916780498cc8cbe559848b8bd1087e28"
  HDIFFPATCH_SHA256: "77f141386e5d8f785c1c846e10fbbc19b6c05aa00e3f59cc44670fb3f0e2ae94"
  HSYNZ_SHA256: "b966359c512f37e94b1616a5f33c3e0502e2f9d11012e894832c846a91c91bc6"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set environment
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION=${{ github.ref_name }}
          else
            VERSION=$(head -c7 <<< "${{ github.sha }}")
          fi
          mkdir payload
          for i in ./*.ps1; do
            sed s/v0.0.0/$VERSION/ "$i" > "payload/$i"
          done

      - name: Download 7-Zip-zstd (Windows x64)
        run: |
          curl -fSLo 7z-zstd.exe \
            "https://github.com/mcmilk/7-Zip-zstd/releases/download/${SEVENZIP_VER}/${SEVENZIP_NAME}"
          echo "${SEVENZIP_WIN_SHA256} 7z-zstd.exe" | sha256sum -c
          7z e -y 7z-zstd.exe -otemp
          mv -vf temp/7z.{exe,dll} payload
          rm -rf temp

      - name: Download 7-Zip-zstd SFX module
        run: |
          curl -fSLo Sfx-Setup-x64.7z \
            "https://github.com/mcmilk/7-Zip-zstd/releases/download/${SEVENZIP_SFX_VER}/Sfx-Setup-x64.7z"
          echo "${SEVENZIP_SFX_SHA256} Sfx-Setup-x64.7z" | sha256sum -c
          7z e -y Sfx-Setup-x64.7z -otemp
          mv -vf temp/7zSD.sfx payload
          rm -rf temp

      - name: Download HDiffPatch
        run: |
          curl -fSLo hdiffpatch.zip \
            "https://github.com/sisong/HDiffPatch/releases/download/${HDIFFPATCH_VER}/hdiffpatch_${HDIFFPATCH_VER}_bin_windows64.zip"
          echo "${HDIFFPATCH_SHA256} hdiffpatch.zip" | sha256sum -c
          7z e -y hdiffpatch.zip -otemp
          mv -vf temp/h{diff,patch}z.exe payload
          rm -rf temp

      - name: Download hsynz
        run: |
          curl -fSLo hsynz.zip \
            "https://github.com/sisong/hsynz/releases/download/${HSYNZ_VER}/hsynz_${HSYNZ_VER}_bin_windows64.zip"
          echo "${HSYNZ_SHA256} hsynz.zip" | sha256sum -c
          7z e -y hsynz.zip -otemp
          mv -vf temp/hs{ign_diff,ync_make}.exe payload
          rm -rf temp

      - name: Download 7-Zip-zstd (Linux) for zstd compression
        run: |
          curl -fSLo 7z-zstd-linux.zip \
            "https://github.com/mcmilk/7-Zip-zstd/releases/download/${SEVENZIP_VER}/linux-gcc-x64.zip"
          echo "${SEVENZIP_LINUX_SHA256} 7z-zstd-linux.zip" | sha256sum -c
          7z e -y 7z-zstd-linux.zip -otemp
          mv -vf temp/7zz .
          rm -rf temp
          chmod +x 7zz

      - name: Create 7-Zip-zstd archive
        run: |
          cd payload
          ../7zz a -m0=zstd -mmax ../payload.7z \*

      - name: Create 7-Zip-zstd SFX executable
        run: |
          OUTPUT_NAME="TRSS-PatchGUI-${GITHUB_REF_NAME//\//-}.exe"
          cat payload/7zSD.sfx - payload.7z > "$OUTPUT_NAME" << 'EOF'
          ;!@Install@!UTF-8!
          ExecuteFile="powershell.exe"
          ExecuteParameters="-NoProfile -ExecutionPolicy Bypass -File .\gui.ps1"
          ;!@InstallEnd@!
          EOF
          echo "OUTPUT_NAME=${OUTPUT_NAME}" >> "$GITHUB_ENV"
          stat "$OUTPUT_NAME"
          sha256sum "$OUTPUT_NAME"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: ${{ env.OUTPUT_NAME }}
          if-no-files-found: error

      - name: Upload to Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.OUTPUT_NAME }}
          generate_release_notes: true