name: Build Remote-PatchGUI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  XXHASH_VER: "v0.8.3"
  SEVENZIP_VER: "v26.02-v1.5.7-R2"
  SEVENZIP_NAME: "7z26.02-zstd-x64-ndm.exe"
  SEVENZIP_SFX_VER: "v25.01-v1.5.7-R3"
  HDIFFPATCH_VER: "v5.1.3"
  HSYNZ_VER: "v1.3.0"

  XXHASH_SHA256: "a6a6170d07ca37d74151dbea9cd6e1dbb881b5ceea34b9447e01f62b1442d40a"
  SEVENZIP_WIN_SHA256: "c84fa1bef4de48249bbdd5ecf7f6f24b0c1d9fcc1fb7644885af69d2cdee0446"
  SEVENZIP_LINUX_SHA256: "be246e5a284d3b5e738bad5cbb24c2662996ddb9776e09575b5099ab53fa0ba3"
  SEVENZIP_SFX_SHA256: "5be3ea8ce38731570786c700f1d7437ec81d59067b7cb6851242e05a0533c4af"
  HDIFFPATCH_SHA256: "77f141386e5d8f785c1c846e10fbbc19b6c05aa00e3f59cc44670fb3f0e2ae94"
  HSYNZ_SHA256: "b966359c512f37e94b1616a5f33c3e0502e2f9d11012e894832c846a91c91bc6"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set environment
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION=${{ github.ref_name }}
          else
            VERSION=$(head -c7 <<< "${{ github.sha }}")
          fi
          mkdir payload
          for i in ./*.ps1; do
            sed s/v0.0.0/$VERSION/ "$i" > "payload/$i"
          done

      - name: Download xxHash
        run: |
          curl -fLo xxhash.zip \
            "https://github.com/Cyan4973/xxHash/releases/download/${XXHASH_VER}/xxhsum_win64_${XXHASH_VER//./_}.zip"
          echo "${XXHASH_SHA256} xxhash.zip" | sha256sum -c
          7z e -y xxhash.zip -otemp
          mv -vf temp/xxhsum.exe payload
          rm -rf temp xxhash.zip

      - name: Download 7-Zip-zstd (Windows x64)
        run: |
          curl -fLo 7z-zstd.7z \
            "https://github.com/mcmilk/7-Zip-zstd/releases/download/${SEVENZIP_VER}/${SEVENZIP_NAME}"
          echo "${SEVENZIP_WIN_SHA256} 7z-zstd.7z" | sha256sum -c
          7z e -y 7z-zstd.7z -otemp
          mv -vf temp/7z.{exe,dll} payload
          rm -rf temp 7z-zstd.7z

      - name: Download 7-Zip-zstd SFX module
        run: |
          curl -fLo Sfx-Setup.7z \
            "https://github.com/mcmilk/7-Zip-zstd/releases/download/${SEVENZIP_SFX_VER}/Sfx-Setup-x64-ndm.7z"
          echo "${SEVENZIP_SFX_SHA256} Sfx-Setup.7z" | sha256sum -c
          7z e -y Sfx-Setup.7z -otemp
          mv -vf temp/7zSD.sfx payload
          rm -rf temp Sfx-Setup.7z

      - name: Download HDiffPatch
        run: |
          curl -fLo hdiffpatch.zip \
            "https://github.com/sisong/HDiffPatch/releases/download/${HDIFFPATCH_VER}/hdiffpatch_${HDIFFPATCH_VER}_bin_windows64.zip"
          echo "${HDIFFPATCH_SHA256} hdiffpatch.zip" | sha256sum -c
          7z e -y hdiffpatch.zip -otemp
          mv -vf temp/h{diff,patch}z.exe payload
          rm -rf temp hdiffpatch.zip

      - name: Download hsynz
        run: |
          curl -fLo hsynz.zip \
            "https://github.com/sisong/hsynz/releases/download/${HSYNZ_VER}/hsynz_${HSYNZ_VER}_bin_windows64.zip"
          echo "${HSYNZ_SHA256} hsynz.zip" | sha256sum -c
          7z e -y hsynz.zip -otemp
          mv -vf temp/hs{ign_diff,ync_make}.exe payload
          rm -rf temp hsynz.zip

      - name: Download 7-Zip-zstd (Linux) for zstd compression
        run: |
          curl -fLo 7z-zstd-linux.zip \
            "https://github.com/mcmilk/7-Zip-zstd/releases/download/${SEVENZIP_VER}/linux-gcc-x64.zip"
          echo "${SEVENZIP_LINUX_SHA256} 7z-zstd-linux.zip" | sha256sum -c
          7z e -y 7z-zstd-linux.zip -otemp
          mv -vf temp/7zz .
          rm -rf temp 7z-zstd-linux.zip
          chmod +x 7zz

      - name: Create 7-Zip-zstd archive
        run: |
          cd payload
          ../7zz a -m0=zstd -mmax ../payload.7z \*

      - name: Create 7-Zip-zstd SFX executable
        run: |
          OUTPUT_NAME="Remote-PatchGUI-${GITHUB_REF_NAME//\//-}.exe"
          cat payload/7zSD.sfx - payload.7z > "$OUTPUT_NAME" << 'EOF'
          ;!@Install@!UTF-8!
          ExecuteFile="powershell.exe"
          ExecuteParameters="-NoProfile -ExecutionPolicy Bypass -File .\gui.ps1"
          ;!@InstallEnd@!
          EOF
          echo "OUTPUT_NAME=${OUTPUT_NAME}" >> "$GITHUB_ENV"
          stat "$OUTPUT_NAME"
          sha256sum "$OUTPUT_NAME"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: ${{ env.OUTPUT_NAME }}
          if-no-files-found: error

      - name: Upload to Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.OUTPUT_NAME }}
